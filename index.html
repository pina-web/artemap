<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>아르떼 시공 아파트 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 흰 바탕의 작업 화면. 왼쪽 파스텔 전국 지도, 오른쪽 지역·년월 목록, 단지 상세는 오른쪽 서랍. */
:root{
  --bg:#ffffff; --ink:#1f2b33; --muted:#66737c; --faint:#97a2aa; --line:#e5e9ec; --wash:#f6f8f9;
  --accent:#2b6a86; --accent-ink:#ffffff; --accent-soft:#e3eff4;
  --hot:#e8775a; --warm:#4f9a8a; --cool:#9aa7c4;
  --sea:#fbfdfe;
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;min-height:100%;padding-inline:16px;padding-block:12px 16px;gap:12px;max-width:1500px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--f-display);font-size:1.45rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand small{color:var(--muted);font-size:.8rem}
.search{position:relative;flex:1 1 320px;min-width:0;max-width:560px}
.search input{width:100%;height:42px;border:1.5px solid var(--line);border-radius:21px;padding:0 44px 0 18px;background:var(--bg);font-size:15px}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.search .clear{position:absolute;right:8px;top:7px;width:28px;height:28px;border:0;background:var(--wash);border-radius:50%;color:var(--muted)}
.sug{position:absolute;left:0;right:0;top:46px;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(31,43,51,.12);z-index:30;max-height:360px;overflow:auto;padding:6px}
.sug button{display:flex;width:100%;justify-content:space-between;gap:10px;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left}
.sug button:hover,.sug button.on{background:var(--accent-soft)}
.sug .where{color:var(--muted);font-size:.8rem;white-space:nowrap}
.sug mark{background:#fde7a6;color:inherit;border-radius:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:var(--wash)}
.btn.danger{color:#b4442c;border-color:#f0cfc6}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;color:var(--muted);font-size:.85rem}
.stats b{color:var(--ink);font-family:var(--f-num);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--wash);font-size:.78rem;color:var(--muted)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.pill.ok i{background:#3fae7c}.pill.local i{background:#e2a33b}
main.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;flex:1;min-height:0}
@media (max-width:900px){main.grid{grid-template-columns:minmax(0,1fr)}}
.mapbox{position:relative;border:1px solid var(--line);border-radius:16px;background:var(--sea);overflow:hidden;min-height:560px;height:calc(100vh - 170px);max-height:900px}
@media (max-width:900px){.mapbox{height:70vh;min-height:420px}}
.mapbox svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;cursor:grab}
.mapbox svg.drag{cursor:grabbing}
.prov path{stroke:#ffffff;stroke-width:1.1;vector-effect:non-scaling-stroke;transition:filter .2s, opacity .2s}
.prov path:hover{filter:brightness(.96) saturate(1.2)}
.prov path.dim{opacity:.45}
.prov path.sel{stroke:#5b7280;stroke-width:1.6}
.dot{stroke:#fff;vector-effect:non-scaling-stroke;stroke-width:.8;cursor:pointer}
.dot.fade{opacity:.12;pointer-events:none}
.dot.hit{stroke:var(--ink);stroke-width:2}
.rlabel{pointer-events:none;font-family:var(--f-body);font-weight:600;fill:#3a4952;paint-order:stroke;stroke:#ffffffcc;stroke-width:3px;stroke-linejoin:round}
.rlabel .n{font-family:var(--f-num);font-weight:500;fill:#5c6b74}
.ring{fill:none;stroke:var(--hot);vector-effect:non-scaling-stroke;stroke-width:2;animation:ring 1.4s ease-out infinite}
@keyframes ring{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion:reduce){.ring{animation:none}}
.mapctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:17px;line-height:1}
.mapctl .home{width:auto;padding:0 10px;font-size:13px;font-weight:600}
.crumb{position:absolute;left:14px;top:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:600;display:flex;gap:8px;align-items:center}
.crumb span{color:var(--muted);font-weight:400;font-size:.85rem}
.legend{position:absolute;left:14px;bottom:12px;background:#ffffffe6;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;max-width:calc(100% - 28px)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;padding:5px 9px;border-radius:7px;font-size:.8rem;white-space:nowrap;transform:translate(-50%,-130%);z-index:5}
.tip small{opacity:.75;margin-left:6px;font-family:var(--f-num)}
aside.side{border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-height:0;height:calc(100vh - 170px);max-height:900px;min-width:0}
@media (max-width:900px){aside.side{height:auto;max-height:none}}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 10px;font-size:.8rem;background:var(--bg)}
.chip button{border:0;background:var(--wash);border-radius:50%;width:18px;height:18px;font-size:11px;line-height:1;color:var(--muted)}
.panel{overflow:auto;padding:10px 12px 14px;flex:1;min-height:0}
details.reg{border-bottom:1px solid var(--line)}
details.reg>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 4px;cursor:pointer;font-weight:600}
details.reg>summary::-webkit-details-marker{display:none}
details.reg>summary .sw{width:12px;height:12px;border-radius:4px;flex:none}
details.reg>summary .cnt{margin-left:auto;font-family:var(--f-num);color:var(--muted);font-weight:500;font-size:.85rem}
details.reg>summary .car{color:var(--faint);transition:transform .15s}
details.reg[open]>summary .car{transform:rotate(90deg)}
.subh{font-size:.75rem;letter-spacing:.06em;color:var(--muted);margin:8px 4px 2px;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:7px 6px;border-radius:8px;text-align:left}
.row:hover{background:var(--wash)}
.row.sel{background:var(--accent-soft)}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .feat{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.ym{font-family:var(--f-num);font-size:.78rem;padding:1px 7px;border-radius:6px;white-space:nowrap;flex:none}
.ym.hot{background:#fde3da;color:#a4442a}.ym.warm{background:#dcefe9;color:#2c6d5f}.ym.cool{background:#e9ecf4;color:#56607a}
.months{display:flex;flex-direction:column;gap:3px;margin-bottom:12px}
.mrow{display:grid;grid-template-columns:76px 1fr 40px;align-items:center;gap:8px;border:0;background:none;padding:4px 4px;border-radius:8px;text-align:left}
.mrow:hover{background:var(--wash)}.mrow.on{background:var(--accent-soft)}
.mrow .lab{font-family:var(--f-num);font-size:.82rem}
.mrow .bar{height:14px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.mrow .bar i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.mrow .v{font-family:var(--f-num);font-size:.8rem;text-align:right;color:var(--muted)}
.hint{color:var(--muted);font-size:.8rem;line-height:1.55;background:var(--wash);border-radius:10px;padding:10px 12px;margin:8px 0}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(31,43,51,.28);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--bg);z-index:41;box-shadow:-12px 0 40px rgba(31,43,51,.18);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{padding:18px 20px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dhead h2{font-family:var(--f-display);font-size:1.3rem;margin:2px 0 4px;text-wrap:balance}
.dhead .loc{color:var(--muted);font-size:.85rem}
.dhead .x{margin-left:auto;border:0;background:var(--wash);width:34px;height:34px;border-radius:50%;flex:none;font-size:16px}
.dbody{overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px;flex:1}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv div{background:var(--wash);border-radius:10px;padding:10px 12px}
.kv dt{font-size:.75rem;color:var(--muted)}.kv dd{margin:2px 0 0;font-weight:600}
.kv dd.num{font-family:var(--f-num);font-weight:500;font-size:1.05rem}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
legend{font-weight:700;margin-bottom:6px;font-size:.95rem}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
label.f input,label.f textarea,label.f select{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--bg);color:var(--ink);font-size:14px;min-width:0;width:100%}
label.f textarea{min-height:76px;resize:vertical;line-height:1.55}
label.f input:focus,label.f textarea:focus,label.f select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hist{display:flex;flex-direction:column;gap:6px}
.hrow{display:grid;grid-template-columns:118px 1fr 1.3fr 30px;gap:6px;align-items:center}
.hrow input{border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0;width:100%}
.hrow button{border:0;background:var(--wash);border-radius:8px;height:30px;color:var(--muted)}
@media (max-width:460px){.hrow{grid-template-columns:1fr 1fr 30px}.hrow .memo{grid-column:1/3}}
.dfoot{border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dfoot .grow{flex:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;z-index:60;font-size:.9rem;max-width:calc(100% - 32px)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;background:var(--bg);border-radius:16px;z-index:50;box-shadow:0 20px 60px rgba(31,43,51,.25);padding:20px;display:flex;flex-direction:column;gap:12px}
.modal h3{font-family:var(--f-display);margin:0;font-size:1.2rem}
.modal textarea.dump{width:100%;min-height:200px;font-family:var(--f-num);font-size:12px;border:1px solid var(--line);border-radius:9px;padding:8px}
.confirm{background:#fff4f1;border:1px solid #f0cfc6;border-radius:10px;padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem}
</style>
</head>
<body>


<div class="app">
  <header class="top">
    <div class="brand"><h1>아르떼 시공 아파트 지도</h1><small>아르떼조명 · 아파트리스트</small></div>
    <div class="search">
      <input id="q" type="search" placeholder="아파트명 검색 (예: 송도, 힐스테이트, 동탄)" autocomplete="off" aria-label="아파트명 검색">
      <button class="clear" id="qclear" aria-label="검색어 지우기" hidden>✕</button>
      <div class="sug" id="sug" hidden></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="btnAdd">＋ 아파트 추가</button>
      <button class="btn" id="btnExport">백업 내보내기</button>
      <button class="btn" id="btnImport">백업 불러오기</button>
      <input type="file" id="fileImport" accept=".json,application/json" hidden>
    </div>
  </header>
  <div class="stats" id="stats"></div>
  <main class="grid">
    <section class="mapbox" id="mapbox" aria-label="전국 시공 지도">
      <svg id="map" viewBox="0 0 524 631" role="img" aria-label="시도별 시공 아파트 분포">
        <g class="prov" id="gProv"></g>
        <g id="gDots"></g>
        <g id="gRing"></g>
        <g id="gLab"></g>
      </svg>
      <div class="crumb" id="crumb">전국</div>
      <div class="mapctl">
        <button class="home" id="zHome" title="전국 보기">전국</button>
        <button id="zIn" aria-label="확대">＋</button>
        <button id="zOut" aria-label="축소">－</button>
      </div>
      <div class="legend">
        <span><i style="background:var(--hot)"></i>최근 2개월</span>
        <span><i style="background:var(--warm)"></i>2026년</span>
        <span><i style="background:var(--cool)"></i>2025년 이전</span>
        <span>· 점 = 단지 1곳 (시군구 중심 근처 배치)</span>
      </div>
      <div class="tip" id="tip" hidden></div>
    </section>
    <aside class="side">
      <div class="tabs" role="tablist">
        <button role="tab" id="tabReg" aria-selected="true">지역별 목록</button>
        <button role="tab" id="tabYm" aria-selected="false">년월 시공 이력</button>
      </div>
      <div class="filters" id="filters"></div>
      <div class="panel" id="panel"></div>
    </aside>
  </main>
</div>

<div id="layer"></div>

const q=$('#q'), sug=$('#sug'); let sugIdx=-1, sugList=[];
function hl(s,qq){ const i=norm(s).indexOf(norm(qq)); if(i<0||!qq) return esc(s);
  // map normalized index back (spaces removed) — simple approach on original
  const raw=s; let ni=0, start=-1, end=-1; const target=norm(qq).length;
  for(let k=0;k<raw.length;k++){ if(/\s/.test(raw[k])) continue; if(ni===i) start=k; if(ni===i+target-1){ end=k+1; break;} ni++; }
  if(start<0||end<0) return esc(s); return esc(raw.slice(0,start))+'<mark>'+esc(raw.slice(start,end))+'</mark>'+esc(raw.slice(end)); }
function showSug(){
  const v=q.value.trim(); if(!v){ sug.hidden=true; return; }
  sugList=ALL.filter(a=>norm(a.n).includes(norm(v))).slice(0,12); sugIdx=-1;
  sug.innerHTML = sugList.length ? sugList.map((a,i)=>`<button data-i="${i}"><span>${hl(a.n,v)}</span><span class="where">${esc(a.r)} ${esc(a.s)} · ${fmtYm(a.ym)}</span></button>`).join('') : `<div class="empty" style="padding:14px">'${esc(v)}' 단지가 없습니다</div>`;
  sug.hidden=false;
}
let qT; q.addEventListener('input',()=>{ $('#qclear').hidden=!q.value; showSug(); clearTimeout(qT); qT=setTimeout(()=>{ ui.q=q.value.trim(); render(); },160); });
q.addEventListener('keydown',e=>{
  const btns=[...sug.querySelectorAll('button')];
  if(e.key==='ArrowDown'){ e.preventDefault(); sugIdx=Math.min(btns.length-1,sugIdx+1); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); sugIdx=Math.max(0,sugIdx-1); }
  else if(e.key==='Enter'){ e.preventDefault(); const a=sugList[Math.max(0,sugIdx)]; if(a) pick(a); return; }
  else if(e.key==='Escape'){ sug.hidden=true; return; } else return;
  btns.forEach((b,i)=>b.classList.toggle('on',i===sugIdx));
});
sug.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) pick(sugList[+b.dataset.i]); });
document.addEventListener('click',e=>{ if(!e.target.closest('.search')) sug.hidden=true; });

async function initStore(){

function coordFor(r,s){
  const subs=SUB[r]||{}; let c=subs[s];
  if(!c){ const k=Object.keys(subs).find(k=>k.includes(s)||s.includes(k.replace(/(시|군|구)$/,''))); c=k?subs[k]:null; }
  if(!c){ const v=Object.values(subs); c=v.length? [v.reduce((t,x)=>t+x[0],0)/v.length, v.reduce((t,x)=>t+x[1],0)/v.length] : [36.5,127.8]; }
  const ang=Math.random()*Math.PI*2, rad=0.004+Math.random()*0.01;
  return {lat:+(c[0]+rad*Math.sin(ang)).toFixed(4), lng:+(c[1]+rad*Math.cos(ang)*1.2).toFixed(4)};
}

  const close=()=>$('#layer').innerHTML=''; $('#exClose').onclick=close; $('#scrim').onclick=close;
  $('#exJson').onclick=()=>offerFile(`아르떼_시공아파트_백업_${stamp}.json`, JSON.stringify(backupData(),null,1));
  $('#exCsv').onclick=()=>{
    const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
    const rows=[['시도','시군구','아파트명','최근시공년월','폴더수정일','세대수','평형타입','시공사','시공품목','특징주의사항','메모','시공이력']];
    for(const a of ALL.slice().sort((x,y)=>ORDER.indexOf(x.r)-ORDER.indexOf(y.r)||x.s.localeCompare(y.s,'ko')||x.n.localeCompare(y.n,'ko'))){ const f=a.features||{};
      rows.push([a.r,a.s,a.n,a.ym,a.d,f.units,f.types,f.builder,f.items,f.notes,f.memo,(a.installs||[]).map(h=>[h.ym,h.unit,h.memo].filter(Boolean).join(' ')).join(' / ')]); }
    offerFile(`아르떼_시공아파트_목록_${stamp}.csv`, '﻿'+rows.map(r=>r.map(cell).join(',')).join('\r\n'));
  };
};
$('#btnImport').onclick=()=>$('#fileImport').click();
$('#fileImport').onchange=async e=>{
  const file=e.target.files[0]; e.target.value=''; if(!file) return;
  let data; try{ data=JSON.parse(await file.text()); }catch{ toast('JSON 파일을 읽지 못했습니다. 내보내기로 만든 백업 파일인지 확인하세요.'); return; }
  if(!data || data.app!=='arte-apt-map' || typeof data.edits!=='object'){ toast('이 지도의 백업 파일이 아닙니다.'); return; }
  const ids=Object.keys(data.edits);
  $('#layer').innerHTML=`<div class="scrim" id="scrim"></div><div class="modal" role="dialog" aria-modal="true"><h3>백업 불러오기</h3>
  <p style="margin:0">${esc(file.name)} · ${esc((data.exportedAt||'').slice(0,10))} 백업<br>입력·수정된 단지 <b>${ids.length}</b>곳의 기록을 현재 지도에 덮어씁니다. 백업에 없는 현재 입력은 그대로 둡니다.</p>
  <div id="impProg" class="hint" hidden></div>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="iNo">취소</button><button class="btn primary" id="iYes">불러오기</button></div></div>`;
  const close=()=>$('#layer').innerHTML=''; $('#iNo').onclick=close; $('#scrim').onclick=close;
  $('#iYes').onclick=async()=>{
    $('#iYes').disabled=true; const prog=$('#impProg'); prog.hidden=false; let ok=0;
    for(const id of ids){ const d=data.edits[id]; if(!d||typeof d!=='object') continue; if(await putEdit(id,{...d})) ok++; prog.textContent=`${ok} / ${ids.length} 저장 중…`; }
    render(); close(); toast(`${ok}곳의 기록을 불러왔습니다`);
  };
};

/* ---------- boot ---------- */
buildMap();
render();
requestAnimationFrame(()=>homeView(false));
window.addEventListener('resize',()=>{ if(ui.region) zoomToRegion(ui.region); else homeView(false); });
initStore();
</script>
